<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Particle Heart</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020006;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .message {
        position: fixed;
        left: 50%;
        bottom: 7%;
        transform: translateX(-50%);
        color: #ffb6e6;
        font-size: clamp(22px, 4vw, 42px);
        font-weight: bold;
        letter-spacing: 7px;
        text-shadow:
            0 0 8px #ff69b4,
            0 0 20px #ff1493,
            0 0 40px #ff1493;
        animation: glow 1.2s infinite alternate;
        pointer-events: none;
        white-space: nowrap;
    }

    @keyframes glow {
        from { opacity: .65; }
        to { opacity: 1; }
    }
</style>
</head>

<body>
<canvas id="canvas"></canvas>
<div class="message">I LOVE YOU</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, dpr;
let particles = [];
const COUNT = 1800;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    makeParticles();
}

function heartPoint() {
    // Công thức trái tim tham số
    const t = Math.random() * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    // Phân bố hạt vào cả phần bên trong
    const fill = Math.sqrt(Math.random());

    return {
        x: x * fill,
        y: y * fill
    };
}

function makeParticles() {
    particles = [];

    const scale = Math.min(W, H) / 32;

    for (let i = 0; i < COUNT; i++) {
        const hp = heartPoint();

        particles.push({
            x: Math.random() * W,
            y: Math.random() * H,

            tx: W / 2 + hp.x * scale,
            ty: H / 2 - hp.y * scale,

            size: Math.random() * 1.8 + 0.4,
            speed: Math.random() * 0.025 + 0.018,
            phase: Math.random() * Math.PI * 2,
            twinkle: Math.random() * 0.08 + 0.02,

            // dùng để tạo chuyển động nhẹ quanh vị trí đích
            offset: Math.random() * 1000
        });
    }
}

window.addEventListener("resize", resize);
resize();

let time = 0;

function draw() {
    time += 0.025;

    // Bóng mờ để tạo đuôi chuyển động
    ctx.fillStyle = "rgba(2, 0, 6, 0.18)";
    ctx.fillRect(0, 0, W, H);

    const beat = 1 + Math.sin(time * 3.0) * 0.035;

    for (const p of particles) {

        // Trạng thái: tụ vào trái tim / tan ra theo chu kỳ
        const cycle = time % 14;

        let targetX = p.tx;
        let targetY = p.ty;

        if (cycle < 4.5) {
            // Bay từ ngoài vào
            p.x += (targetX - p.x) * p.speed;
            p.y += (targetY - p.y) * p.speed;

        } else if (cycle < 9.5) {
            // Trái tim đập
            const dx = targetX - W / 2;
            const dy = targetY - H / 2;

            const bx = W / 2 + dx * beat;
            const by = H / 2 + dy * beat;

            p.x += (bx - p.x) * 0.12;
            p.y += (by - p.y) * 0.12;

        } else {
            // Tan ra
            const dx = targetX - W / 2;
            const dy = targetY - H / 2;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;

            const progress = (cycle - 9.5) / 4.5;

            const spread = progress * progress * 2.5;

            const bx = targetX + (dx / len) * spread * W;
            const by = targetY + (dy / len) * spread * H;

            p.x += (bx - p.x) * 0.08;
            p.y += (by - p.y) * 0.08;
        }

        // Lấp lánh
        const glow =
            0.55 +
            0.45 * Math.sin(time * 5 + p.phase);

        const r = p.size * (0.8 + glow * 0.5);

        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);

        // Hạt hồng + một số hạt trắng sáng
        if (Math.sin(time * 4 + p.phase) > 0.92) {
            ctx.fillStyle = "rgba(255, 235, 250, 0.95)";
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 10;
        } else {
            ctx.fillStyle = `rgba(255, ${70 + Math.floor(glow * 80)}, ${150 + Math.floor(glow * 70)}, ${0.55 + glow * 0.45})`;
            ctx.shadowColor = "#ff1493";
            ctx.shadowBlur = 7;
        }

        ctx.fill();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
